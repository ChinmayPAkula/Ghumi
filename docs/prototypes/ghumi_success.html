<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghumi — Trip confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=General+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EF;
    --ink:#16241F;
    --brand:#1F5C4A;
    --dusk:#16332B;
    --brass:#C98A3B;
    --route:#A83E32;
    --line:#D8D3C4;
    --muted:#6B7570;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'General Sans', sans-serif;
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
    position:relative;
    overflow:hidden;
  }

  /* confetti-ish scatter, kept restrained and on-palette */
  .scatter{position:absolute; inset:0; z-index:0; pointer-events:none;}
  .scatter span{
    position:absolute; border-radius:2px; opacity:0.55;
    animation:drift 5.5s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-14px) rotate(12deg); }
  }

  .wordmark{
    position:absolute; top:28px; left:32px; z-index:2;
    font-family:'Fraunces', serif; font-weight:600; font-size:19px; color:var(--ink);
  }
  .wordmark .dot{color:var(--brass);}

  .stage{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    max-width:440px;
    width:100%;
  }

  .badge{
    width:56px; height:56px; border-radius:50%;
    background:var(--brand); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; margin-bottom:22px;
    box-shadow:0 10px 24px rgba(31,92,74,0.28);
    animation:pop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes pop{
    0%{ transform:scale(0.4); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }

  .headline{
    font-family:'Fraunces', serif; font-weight:600; font-size:clamp(26px,4vw,34px);
    letter-spacing:-0.01em; margin-bottom:8px;
  }
  .sub{
    font-family:'Fraunces', serif; font-style:italic; font-weight:300; font-size:14.5px;
    color:var(--muted); margin-bottom:36px; line-height:1.5;
  }

  /* completed boarding pass */
  .pass{
    width:100%;
    background:var(--dusk);
    border-radius:18px;
    padding:24px 26px;
    text-align:left;
    box-shadow:0 24px 50px rgba(22,36,31,0.22);
    position:relative;
    margin-bottom:30px;
  }
  .pass-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .pass-status{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--brass); display:flex; align-items:center; gap:6px;
  }
  .pass-status::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--brass);}
  .pass-id{font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:rgba(246,244,239,0.4);}

  .pass-route{display:flex; align-items:center; gap:12px; margin:18px 0 20px;}
  .pass-city{font-family:'Fraunces', serif; font-size:30px; color:var(--paper); line-height:1;}
  .pass-city small{display:block; font-family:'IBM Plex Mono', monospace; font-size:9px; color:rgba(246,244,239,0.45); letter-spacing:0.08em; margin-top:4px;}
  .pass-line{flex:1; height:1px; position:relative; background-image:repeating-linear-gradient(90deg, var(--route) 0 7px, transparent 7px 14px);}
  .pass-line .plane{position:absolute; top:-8px; left:50%; transform:translateX(-50%) rotate(90deg); color:var(--brass); font-size:14px;}

  .pass-divider{height:1px; margin:18px 0; background:repeating-linear-gradient(90deg, rgba(246,244,239,0.18) 0 6px, transparent 6px 12px);}

  .pass-fields{display:flex; justify-content:space-between;}
  .pass-fields div label{display:block; font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(246,244,239,0.45); margin-bottom:4px;}
  .pass-fields div span{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--paper);}

  .pass-notch{
    position:absolute; top:50%; width:20px; height:20px; background:var(--paper);
    border-radius:50%; transform:translateY(-50%);
  }
  .pass-notch.left{left:-10px;}
  .pass-notch.right{right:-10px;}

  .actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; width:100%;}
  .btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase;
    padding:13px 24px; border-radius:30px; text-decoration:none; display:inline-block;
    transition:transform 0.15s ease; flex:1; text-align:center;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.primary{background:var(--brand); color:var(--paper);}
  .btn.ghost{border:1px solid var(--line); color:var(--ink);}
</style>
</head>
<body>

<div class="scatter">
  <span style="left:12%; top:18%; width:6px; height:14px; background:var(--brass); animation-delay:0s;"></span>
  <span style="left:22%; top:65%; width:5px; height:5px; background:var(--route); border-radius:50%; animation-delay:0.4s;"></span>
  <span style="left:85%; top:22%; width:6px; height:14px; background:var(--brand); animation-delay:0.8s;"></span>
  <span style="left:78%; top:70%; width:5px; height:5px; background:var(--brass); border-radius:50%; animation-delay:1.1s;"></span>
  <span style="left:6%; top:80%; width:6px; height:6px; background:var(--route); border-radius:50%; animation-delay:1.6s;"></span>
  <span style="left:92%; top:50%; width:6px; height:14px; background:var(--muted); animation-delay:0.6s;"></span>
</div>

<div class="wordmark">Ghumi<span class="dot">.</span></div>

<div class="stage">
  <div class="badge">✓</div>
  <div class="headline">Your trip is booked</div>
  <div class="sub">flights and stay confirmed — the agents wrapped everything into one itinerary.</div>

  <div class="pass">
    <div class="pass-notch left"></div>
    <div class="pass-notch right"></div>
    <div class="pass-top">
      <span class="pass-status">Confirmed</span>
      <span class="pass-id">GHM-8841</span>
    </div>
    <div class="pass-route">
      <div class="pass-city">BLR<small>Bengaluru</small></div>
      <div class="pass-line"><span class="plane">✈</span></div>
      <div class="pass-city">HND<small>Tokyo</small></div>
    </div>
    <div class="pass-divider"></div>
    <div class="pass-fields">
      <div><label>Traveler</label><span>A. Rao</span></div>
      <div><label>Dates</label><span>12–19 Mar</span></div>
      <div><label>Stay</label><span>Shinjuku Gracery</span></div>
    </div>
  </div>

  <div class="actions">
    <a href="#" class="btn primary">View itinerary</a>
    <a href="#" class="btn ghost">Share trip</a>
  </div>
</div>

</body>
</html>
